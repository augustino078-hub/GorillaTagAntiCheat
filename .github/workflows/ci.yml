name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore GorillaTagAntiCheat.sln

      - name: Build (Core + Tests)
        run: dotnet build GorillaTagAntiCheat.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test GorillaTagAntiCheat.sln --configuration Release --no-build --verbosity normal
